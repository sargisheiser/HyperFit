# HyperFit Workflow Add Database Table Or Model

## Action

Follow the add-database-table-or-model workflow:
1. Create or update SQLAlchemy model in backend/models/*.py
2. Update backend/models/__init__.py to import the new model
3. Update backend/models/related_model.py if relationships are needed
4. Generate Alembic migration in alembic/versions/*.py
5. Update backend/core/database.py if DB logic changes
6. Update or add Pydantic schemas in backend/schemas/*.py
7. Update or add tests in backend/tests/test_*.py

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: backend/models/*.py, backend/models/__init__.py, alembic/versions/*.py

