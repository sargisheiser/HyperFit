version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyperfit-backend-prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ALLOWED_EXTENSIONS=jpg,jpeg,png,gif,webp,mp4,avi,mov
      - MAX_FILE_SIZE=10485760
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_db:/app/database
    restart: always
    networks:
      - hyperfit-network
    # Remove port mapping for production (use reverse proxy)
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hyperfit-frontend-prod
    depends_on:
      - backend
    restart: always
    networks:
      - hyperfit-network
    # Remove port mapping for production (use reverse proxy)
    # ports:
    #   - "80:80"

  # Production reverse proxy (optional)
  # nginx:
  #   image: nginx:alpine
  #   container_name: hyperfit-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   restart: always
  #   networks:
  #     - hyperfit-network

networks:
  hyperfit-network:
    driver: bridge

volumes:
  backend_uploads:
  backend_logs:
  backend_db:


