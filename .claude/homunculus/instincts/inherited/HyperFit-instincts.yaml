# HyperFit Workflow Add New Backend Feature Tdd

## Action

Follow the add-new-backend-feature-tdd workflow:
1. Create or update SQLAlchemy models in backend/models/*.py
2. Update backend/models/__init__.py to import new models
3. Add or update Pydantic schemas in backend/schemas/*.py
4. Implement business logic in backend/services/*.py
5. Add or update API routers in backend/api/*_router.py or backend/api/*.py
6. Write or update tests in backend/tests/test_*.py and/or backend/tests/conftest.py
7. Update backend/core/config.py if new configuration is needed
8. Update backend/core/database.py if DB logic changes
9. Add Alembic migration in alembic/versions/*.py if new tables/fields are added

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: backend/models/*.py, backend/models/__init__.py, backend/schemas/*.py

