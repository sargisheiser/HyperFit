# HYPERFIT Docker Compose Configuration
version: '3.8'

services:
  hyperfit-backend:
    build: 
      context: ..
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./hyperfit.db
      - DEBUG=True
    volumes:
      - ../uploads:/app/uploads
      - ../hyperfit.db:/app/hyperfit.db
    restart: unless-stopped

