version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyperfit-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./database.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://localhost
      - ALLOWED_EXTENSIONS=jpg,jpeg,png,gif,webp,mp4,avi,mov
      - MAX_FILE_SIZE=10485760
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - ./database.db:/app/database.db
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hyperfit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hyperfit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hyperfit-network

  # Optional: PostgreSQL database (uncomment to use instead of SQLite)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: hyperfit-db
  #   environment:
  #     - POSTGRES_DB=hyperfit
  #     - POSTGRES_USER=hyperfit
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   networks:
  #     - hyperfit-network

networks:
  hyperfit-network:
    driver: bridge

