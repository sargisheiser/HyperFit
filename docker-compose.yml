version: '3.9'

services:
  backend:
    build: ./backend
    container_name: hyperfit-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on: []

  frontend:
    build: ./frontend
    container_name: hyperfit-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend


